# Le plan gratuit de Supabase met le projet en pause après 7 jours sans requête.
# Un appel léger tous les 3 jours le garde éveillé, même si personne n'ouvre l'app.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping
        run: |
          URL=$(jq -r .url supabase.config.json)
          KEY=$(jq -r .key supabase.config.json)
          curl -fsS -X POST "$URL/rest/v1/rpc/sm_pull" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_req":[]}'
